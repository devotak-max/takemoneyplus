# Edite "monetheus-CHANGE-ME" para um nome único globalmente no Fly
# (ex.: monetheus-seunome). É o que vai virar a sua URL pública.
app = "monetheus-CHANGE-ME"
primary_region = "gru"  # São Paulo

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATA_DIR = "/data"

# Volume persistente para o SQLite. Crie antes do primeiro deploy:
#   fly volumes create monetheus_data --size 1 --region gru
[[mounts]]
  source = "monetheus_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# 1 máquina única — múltiplas máquinas com SQLite no mesmo volume
# causariam conflito de escrita. Para escalar de verdade, migrar para Postgres.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
